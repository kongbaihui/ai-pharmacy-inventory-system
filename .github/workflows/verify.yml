name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ai_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      RUN_AI_DB_INTEGRATION: "true"
      AI_TEST_DB_URL: jdbc:mysql://127.0.0.1:3306/ai_test?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
      AI_TEST_DB_USER: root
      AI_TEST_DB_PASSWORD: root
    defaults:
      run:
        working-directory: RuoYi-Vue-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: RuoYi-Vue-master/pom.xml
      - run: mvn -B test

  web:
    name: Web production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RuoYi-Vue2-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build:prod
