name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RuoYi-Vue-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: RuoYi-Vue-master/pom.xml
      - run: mvn -B test

  web:
    name: Web production build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: RuoYi-Vue2-master
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install --legacy-peer-deps --no-audit --no-fund
      - run: npm run build:prod
